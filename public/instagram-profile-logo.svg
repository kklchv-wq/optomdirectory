<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Deep Teal Gradient for Instagram Profile Avatar Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1:1 Square Background (Optimized for Instagram Circular Crop) -->
  <rect width="1080" height="1080" fill="url(#bgGradient)" />

  <!-- Instagram Safe Area Preview Guide (Hidden in vector export) -->
  <circle cx="540" cy="540" r="520" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="8 8" stroke-width="2" />

  <!-- Optom Directory Glasses Logo Icon (Centered, Pure White Vector) -->
  <g transform="translate(224.33, 373.47) scale(3.5)" filter="url(#softGlow)">
    <!-- Left Eye Outer Ring / Socket -->
    <path
      fill="#ffffff"
      d="M42.97,83.92C21.17,83.92,0,67.79,0,41.83S21.17,0,42.97,0s42.97,16.13,42.97,41.83-21.17,42.09-42.97,42.09ZM42.97,14.11c-13.48,0-26.84,10.58-26.84,27.97s13.36,28.1,26.84,28.1,26.84-10.58,26.84-28.1-13.61-27.97-26.84-27.97Z"
    />

    <!-- Right Eye Diagnostic Tool Frame -->
    <path
      fill="#ffffff"
      d="M94.46,30.13v12.2c.1,15.25,7.53,27.08,18.07,34.19l-5.57,9.64,8.74,5.05,5.8-10.05c3.48,1.32,7.14,2.2,10.86,2.63v11.35h10.1v-11.35c3.72-.43,7.38-1.31,10.86-2.63l5.8,10.05,8.74-5.05-5.57-9.64c10.54-7.12,17.97-18.94,18.07-34.19v-12.2h-85.92ZM137.42,70.37c-13.47,0-26.81-10.56-26.84-28.04h53.68c-.03,17.48-13.62,28.04-26.84,28.04Z"
    />

    <!-- Left Eye Pupil / Iris -->
    <path
      fill="#ffffff"
      d="M51.17,41.96c-9.32,0-16.88,7.56-16.88,16.88s7.56,16.88,16.88,16.88,16.88-7.56,16.88-16.88-7.56-16.88-16.88-16.88ZM58.63,56.36c-1.87,0-3.39-1.52-3.39-3.39s1.52-3.39,3.39-3.39,3.39,1.52,3.39,3.39-1.52,3.39-3.39,3.39Z"
    />
  </g>

  <!-- Optional Subtitle Text inside avatar -->
  <text x="540" y="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#5eead4" text-anchor="middle" letter-spacing="4">
    OPTOM DIRECTORY
  </text>
</svg>
